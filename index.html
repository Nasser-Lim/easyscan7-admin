<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <!-- GitHub Pages 는 응답 헤더를 못 바꾸므로 CSP 를 meta 로 건다.
       스크립트·스타일은 자기 파일만, 통신은 Firebase 로그인·토큰 갱신·백엔드(Cloud Run, 로컬 개발 서버)만,
       원본 증빙 미리보기는 blob: URL 로만 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; frame-src blob:; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.run.app http://localhost:8799; base-uri 'none'; form-action 'none'">
  <title>EASYSCAN · 해외지국 정산관리</title>
  <link rel="icon" href="assets/sbs-logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <noscript>이 페이지는 JavaScript 가 필요합니다.</noscript>
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
